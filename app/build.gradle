plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'br.com.caio.tvhomelab'
    compileSdk 35
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId 'br.com.caio.tvhomelab'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }
}
