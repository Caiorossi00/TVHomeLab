<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="color-scheme" content="dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/styles.css" />

    <title>Caiorossi.dev</title>
  </head>

  <body>
    <main>
      <button class="settings-button" id="settingsButton" type="button" aria-label="Configurações">
        <svg
          viewBox="0 0 24 24"
          width="28"
          height="28"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a1.7 1.7 0 1 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2a1.7 1.7 0 1 1-3.4 0v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4.2a1.7 1.7 0 1 1 0-3.4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V4.2a1.7 1.7 0 1 1 3.4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2a1.7 1.7 0 1 1 0 3.4h-.2a1.7 1.7 0 0 0-1.4.6Z"
          ></path>
        </svg>
      </button>

      <header class="header">
        <p class="date" id="date">Carregando data</p>
        <h1 class="clock" id="clock">00:00</h1>
        <div class="subtitle">Interface de testes versão 1.0</div>
      </header>

      <section class="applications" aria-label="Aplicativos">
        <button class="app" type="button" data-app="stremio" aria-label="Stremio">
          <img class="app-image" src="./images/apps/stremio.jpg" alt="" />
        </button>

        <button class="app" type="button" data-app="youtube" aria-label="YouTube">
          <img class="app-image" src="./images/apps/youtube.jpg" alt="" />
        </button>

        <button class="app" type="button" data-app="veloplay" aria-label="VeloPlay TV">
          <img class="app-image" src="./images/apps/veloplay.png" alt="" />
        </button>
      </section>

      <footer class="footer">
        <span>Caiorossi.dev</span>
        <span class="message" id="message">Use as setas para navegar</span>
      </footer>
    </main>
    <script src="./js/index.js"></script>
  </body>
</html>
