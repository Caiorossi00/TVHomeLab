<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="color-scheme" content="dark" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Caiorossi.dev</title>

    <style>
      :root {
        color-scheme: dark;
        --background: #101114;
        --text: #f5f5f7;
        --text-secondary: #c5c5cc;
        --overlay: rgba(0, 0, 0, 0.55);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--background);
        color: var(--text);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        letter-spacing: -1px;
      }

      body {
        position: relative;
        padding: 6vh 6vw 5vh;
        background-image: url('backgrounds/home-background.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: var(--overlay);
        pointer-events: none;
        z-index: 0;
      }

      main {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      .header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .settings-button {
        position: absolute;
        top: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.3);
        color: var(--text-secondary);
        font: inherit;
        cursor: pointer;
        transition:
          transform 140ms ease,
          background 140ms ease,
          color 140ms ease;
      }

      .settings-button:focus,
      .settings-button.selected {
        outline: none;
        transform: scale(1.08);
        background: rgba(255, 255, 255, 0.16);
        color: var(--text);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8);
      }

      .date {
        margin: 0 0 10px;
        color: var(--text-secondary);
        font-size: clamp(14px, 1.5vw, 20px);
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      }

      .clock {
        margin: 0;
        font-size: clamp(58px, 8vw, 92px);
        font-weight: 400;
        letter-spacing: -4px;
        line-height: 1.05;
        text-shadow: 0 3px 12px rgba(0, 0, 0, 0.65);
      }

      .subtitle {
        margin-top: 12px;
        color: var(--text-secondary);
        font-size: clamp(15px, 1.6vw, 21px);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      }

      .applications {
        display: flex;
        flex-direction: row;
        width: min(100%, 780px);
        margin-top: 28px;
        gap: 22px;
      }

      .app {
        display: flex;
        align-items: center;
        justify-content: center;
        height: clamp(100px, 18vh, 165px);
        min-width: 0;
        margin: 0;
        padding: 0;
        border: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
        transition:
          transform 140ms ease,
          filter 140ms ease;
      }

      .app:focus,
      .app.selected {
        outline: none;
        transform: scale(1.01);
        filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.9))
          drop-shadow(0 4px 12px rgba(0, 0, 0, 0.65));
      }

      .app-image {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        object-fit: contain;
        object-position: center;
        border-radius: 12px;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: auto;
        color: var(--text-secondary);
        font-size: 16px;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      }

      .message {
        min-height: 1.3em;
        text-align: right;
      }

      @media (max-height: 450px) {
        body {
          padding-top: 4vh;
          padding-bottom: 3vh;
        }

        .clock {
          font-size: 58px;
        }

        .applications {
          margin-top: 24px;
        }

        .app {
          height: 100px;
        }

        .settings-button {
          width: 28px;
          height: 28px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app,
        .settings-button {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <button class="settings-button" id="settingsButton" type="button" aria-label="Configurações">
        <svg
          viewBox="0 0 24 24"
          width="28"
          height="28"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a1.7 1.7 0 1 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2a1.7 1.7 0 1 1-3.4 0v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H4.2a1.7 1.7 0 1 1 0-3.4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.6V4.2a1.7 1.7 0 1 1 3.4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2a1.7 1.7 0 1 1 0 3.4h-.2a1.7 1.7 0 0 0-1.4.6Z"
          ></path>
        </svg>
      </button>

      <header class="header">
        <p class="date" id="date">Carregando data</p>
        <h1 class="clock" id="clock">00:00</h1>
        <div class="subtitle">Interface de testes versão 1.0</div>
      </header>

      <section class="applications" aria-label="Aplicativos">
        <button class="app" type="button" data-app="stremio" aria-label="Stremio">
          <img class="app-image" src="apps/stremio.jpg" alt="" />
        </button>

        <button class="app" type="button" data-app="youtube" aria-label="YouTube">
          <img class="app-image" src="apps/youtube.jpg" alt="" />
        </button>

        <button class="app" type="button" data-app="veloplay" aria-label="VeloPlay TV">
          <img class="app-image" src="apps/veloplay.png" alt="" />
        </button>
      </section>

      <footer class="footer">
        <span>Caiorossi.dev</span>
        <span class="message" id="message">Use as setas para navegar</span>
      </footer>
    </main>

    <script>
      const clock = document.getElementById('clock');
      const date = document.getElementById('date');
      const message = document.getElementById('message');
      const applications = Array.from(document.querySelectorAll('.app'));
      const settingsButton = document.getElementById('settingsButton');
      const controls = [...applications, settingsButton];

      let selectedIndex = 0;

      function updateClock() {
        const now = new Date();

        clock.textContent = new Intl.DateTimeFormat('pt-BR', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false,
        }).format(now);

        date.textContent = new Intl.DateTimeFormat('pt-BR', {
          weekday: 'long',
          day: 'numeric',
          month: 'long',
        }).format(now);
      }

      function selectControl(index) {
        selectedIndex = (index + controls.length) % controls.length;

        controls.forEach((control, i) => {
          control.classList.toggle('selected', i === selectedIndex);
        });

        controls[selectedIndex].focus({ preventScroll: true });

        message.textContent = controls[selectedIndex].getAttribute('aria-label');
      }

      function activateControl() {
        const control = controls[selectedIndex];

        if (control === settingsButton) {
          if (window.Android && typeof window.Android.openSettings === 'function') {
            window.Android.openSettings();
          } else {
            message.textContent = 'Configurações indisponíveis';
          }

          return;
        }

        const appId = control.dataset.app;

        if (window.Android && typeof window.Android.openApp === 'function') {
          window.Android.openApp(appId);
        } else {
          message.textContent = 'Integração Android indisponível';
        }
      }

      document.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
          event.preventDefault();
          selectControl(selectedIndex + 1);
        } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
          event.preventDefault();
          selectControl(selectedIndex - 1);
        } else if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          activateControl();
        }
      });

      controls.forEach((control, index) => {
        control.addEventListener('focus', () => {
          selectedIndex = index;

          controls.forEach((item, itemIndex) => {
            item.classList.toggle('selected', itemIndex === index);
          });

          message.textContent = control.getAttribute('aria-label');
        });

        control.addEventListener('click', () => {
          selectControl(index);
          activateControl();
        });
      });

      updateClock();
      setInterval(updateClock, 1000);
      selectControl(0);
    </script>
  </body>
</html>
